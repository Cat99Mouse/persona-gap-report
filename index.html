/* ---------- scoring ---------- */

function scoreAnswers(answers){
  const sums = Array(8).fill(0);
  const counts = Array(8).fill(0);
  answers.forEach((optIdx, qi) => {
    const q = QUESTIONS[qi];
    if(!q || optIdx == null) return;
    const opt = q.options[optIdx];
    if(!opt) return;
    sums[q.dim] += opt.s;
    counts[q.dim] += 1;
  });
  return sums.map((sum, i) => counts[i] ? Math.round(sum / (counts[i] * 3) * 100) : 50);
}

function avgScores(list){
  if(!list.length) return null;
  return Array(8).fill(0).map((_, i) => {
    return Math.round(list.reduce((sum, scores) => sum + scores[i], 0) / list.length);
  });
}

function topDims(scores, n){
  return scores
    .map((v, i) => ({ i, v, dist: Math.abs(v - 50) }))
    .sort((a, b) => b.dist - a.dist)
    .slice(0, n);
}

function labelFor(scores){
  const top = topDims(scores, 1)[0];
  if(!top || top.dist < 10) return '查无此人';
  return scores[top.i] >= 50 ? DIMS[top.i].highLabel : DIMS[top.i].lowLabel;
}

function analyze(selfScores, friendScores){
  const gaps = selfScores.map((s, i) => ({
    i,
    self: s,
    friend: friendScores[i],
    gap: friendScores[i] - s
  }));
  const top = gaps.slice().sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap));
  const meanAbs = gaps.reduce((sum, g) => sum + Math.abs(g.gap), 0) / gaps.length;
  return {
    gaps,
    top,
    max: top[0],
    maxAbs: Math.abs(top[0].gap),
    know: Math.max(0, Math.min(100, Math.round(100 - meanAbs)))
  };
}

function misreadSentence(g){
  const d = DIMS[g.i];
  const abs = Math.abs(g.gap);
  if(abs < 6){
    return '在「' + d.name + '」上，朋友眼中的你和自评基本一致——这块你装得还挺像。';
  }
  const direction = g.gap > 0 ? d.highLabel : d.lowLabel;
  if(abs >= 25){
    return '你自评 ' + g.self + '，朋友给你 ' + g.friend + '——这已经不是误读，是两个人。他们觉得你更「' + direction + '」。';
  }
  if(abs >= 12){
    return '你自评 ' + g.self + '，朋友给你 ' + g.friend + '——他们看到的你，和你以为的差挺多。在朋友眼里，你更「' + direction + '」。';
  }
  return '你自评 ' + g.self + '，朋友给你 ' + g.friend + '——有点偏差，但还不算离谱。他们觉得你更「' + direction + '」。';
}

function collectWords(friends){
  const map = new Map();
  friends.forEach(f => {
    (f.words || []).forEach(w => {
      if(w) map.set(w, (map.get(w) || 0) + 1);
    });
  });
  return Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, 14);
}

/* ---------- helpers ---------- */

function esc(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function randomCode(n){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i = 0; i < n; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function b64EncodeUnicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64DecodeUnicode(str){
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let toastTimer = null;
function toast(message){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

async function copyText(text, message){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(message || '已复制');
  }catch(e){
    toast('复制失败，请长按手动复制');
  }
}

function copyEl(id, message){
  const el = document.getElementById(id);
  if(el) copyText(el.innerText, message);
}

/* ---------- radar ---------- */

function radarSVG(selfScores, friendScores, opts){
  opts = opts || {};
  const c1 = opts.c1 || '#ff5a3c';
  const f1 = opts.f1 || 'rgba(255,90,60,.16)';
  const cx = 180, cy = 175, R = 112;
  const angles = Array.from({ length: 8 }, (_, i) => -Math.PI / 2 + i * Math.PI / 4);

  const point = (i, value) => {
    const r = R * Math.max(0, Math.min(100, value)) / 100;
    return [cx + Math.cos(angles[i]) * r, cy + Math.sin(angles[i]) * r];
  };
  const polygon = scores => scores.map((v, i) => point(i, v).join(',')).join(' ');
  const ring = value => {
    const r = R * value / 100;
    return angles.map(a => (cx + Math.cos(a) * r) + ',' + (cy + Math.sin(a) * r)).join(' ');
  };

  const grid = [25, 50, 75, 100]
    .map(v => '<polygon points="' + ring(v) + '" fill="none" stroke="#e7dfd1" stroke-width="1"/>')
    .join('');
  const axes = angles
    .map(a => '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * R) + '" y2="' + (cy + Math.sin(a) * R) + '" stroke="#e7dfd1" stroke-width="1"/>')
    .join('');
  const labels = angles.map((a, i) => {
    const lr = R + 24;
    const x = cx + Math.cos(a) * lr;
    const y = cy + Math.sin(a) * lr;
    const cos = Math.cos(a);
    const anchor = cos > 0.25 ? 'start' : cos < -0.25 ? 'end' : 'middle';
    const dy = Math.sin(a) > 0.6 ? 12 : Math.sin(a) < -0.6 ? -4 : 4;
    return '<text x="' + x + '" y="' + (y + dy) + '" text-anchor="' + anchor + '" fill="#857d70" font-size="11.5">' + DIMS[i].short + '</text>';
  }).join('');
  const friendPoly = friendScores
    ? '<polygon points="' + polygon(friendScores) + '" fill="rgba(47,107,255,.12)" stroke="#2f6bff" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>'
    : '';
  const friendDots = friendScores
    ? friendScores.map((v, i) => {
        const p = point(i, v);
        return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#2f6bff"/>';
      }).join('')
    : '';
  const selfDots = selfScores.map((v, i) => {
    const p = point(i, v);
    return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.2" fill="' + c1 + '"/>';
  }).join('');

  return '<svg viewBox="-34 -24 428 400" class="radar" role="img" aria-label="人设雷达图">'
    + grid + axes
    + friendPoly
    + '<polygon points="' + polygon(selfScores) + '" fill="' + f1 + '" stroke="' + c1 + '" stroke-width="2.5" stroke-linejoin="round"/>'
    + selfDots + friendDots
    + labels
    + '</svg>';
}

function pick(index){
  if(state.locked) return;
  state.locked = true;
  state.answers[state.idx] = index;
  state.pickToken++;
  const token = state.pickToken;

  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('picked', i === index);
  });
  const bar = document.querySelector('.progress > i');
  if(bar) bar.style.width = Math.round((state.idx + 1) / QUESTIONS.length * 100) + '%';

  setTimeout(() => {
    if(token !== state.pickToken) return;
    state.locked = false;
    if(state.idx < QUESTIONS.length - 1){
      state.idx++;
      renderQuiz();
    }else{
      finishQuiz();
    }
  }, 200);
}

function quizBack(){
  state.pickToken++;
  state.locked = false;
  if(state.idx > 0){
    state.idx--;
    renderQuiz();
  }else if(state.mode === 'judge' && state.inviteCode){
    go('invite');
  }else{
    go('home');
  }
}

function finishQuiz(){
  if(state.answers.some(a => a === null)){
    toast('还有题没答完');
    return;
  }
  if(state.mode === 'self'){
    const code = randomCode(6);
    state.self = {
      code,
      answers: state.answers.slice(),
      scores: scoreAnswers(state.answers),
      createdAt: Date.now()
    };
    state.friends = [];
    saveSelf(state.self);
    go('report');
  }else{
    go('words');
  }
}

    <section class="screen">
      <div class="quiz-top">
        <button class="icon-btn" onclick="go('home')" aria-label="返回">←</button>
        <div class="meta">导入好友评价</div>
        <div class="spacer"></div>
      </div>
      <h1 class="brand report">粘贴好友的<br>回传码</h1>
      <p class="lede">好友测完后会得到一段以 P1 开头的码，粘贴到这里，就能看到 TA 眼中的你。</p>
      <textarea class="input code-input" id="importInput" aria-label="好友回传码" placeholder="P1.XXXXXX.0123012301230123..."></textarea>
      <button class="btn primary" style="margin-top:14px" onclick="importFriend()">导入评价</button>
      <p class="foot">回传码只在本机解析，不会上传。</p>
    </section>`;
}

function parseFriendCode(raw){
  const parts = String(raw || '').trim().split('.');
  if(parts.length < 3 || parts[0] !== 'P1') return null;
  const selfCode = parts[1];
  const digits = parts[2];
  if(!/^[A-Z0-9]{6}$/.test(selfCode)) return null;
  if(!/^[0-3]{16}$/.test(digits)) return null;
  const wordsRaw = parts.slice(3).join('.');
  let words = [];
  if(wordsRaw){
    let decoded = '';
    try{
      decoded = wordsRaw.indexOf('%') >= 0 ? decodeURIComponent(wordsRaw) : b64DecodeUnicode(wordsRaw);
    }catch(e){
      decoded = '';
    }
    words = decoded.split('/').filter(Boolean).slice(0, 3);
  }
  return {
    selfCode,
    answers: digits.split('').map(Number),
    words
  };
}

function importFriend(){
  const el = document.getElementById('importInput');
  const raw = el ? el.value : '';
  if(!state.self){
    toast('先完成自己的测试，再导入好友评价');
    return;
  }
  const parsed = parseFriendCode(raw);
  if(!parsed){
    toast('回传码格式不对，请整段粘贴');
    return;
  }
  if(parsed.selfCode !== state.self.code){
    toast('这个回传码不是发给你的');
    return;
  }
  const id = parsed.answers.join('') + '|' + parsed.words.join('/');
  if(state.friends.some(f => f.id === id)){
    toast('这条评价已经导入过了');
    return;
  }
  state.friends.push({
    answers: parsed.answers,
    words: parsed.words,
    scores: scoreAnswers(parsed.answers),
    id,
    ts: Date.now()
  });
  saveFriends(state.self.code, state.friends);
  toast('导入成功');
  go('report');
}

/* ---------- report ---------- */

function renderReport(){
  if(!state.self){
    go('home');
    return;
  }
  const selfScores = state.self.scores || scoreAnswers(state.self.answers);
  const friendScores = state.friends.length
    ? avgScores(state.friends.map(f => f.scores || scoreAnswers(f.answers)))
    : null;
  const selfLabel = labelFor(selfScores);
  const friendLabel = friendScores ? labelFor(friendScores) : null;
  const analysis = friendScores ? analyze(selfScores, friendScores) : null;
  const words = collectWords(state.friends);
  const title = friendScores
    ? '朋友眼中的你，<br>是「' + friendLabel + '」'
    : '你大概是<br>「' + selfLabel + '」';
  const sub = state.friends.length
    ? '已收到 ' + state.friends.length + ' 位好友的评价' + (state.friends.length < 3 ? '，再找几位会更准' : '')
    : '还没有好友评价，先看看你的自画像。';

  const statsHtml = `
    <div class="stats">
      <div class="stat"><b>${analysis ? analysis.know + '<small>%</small>' : '—'}</b><span>好友懂你</span></div>
      <div class="stat"><b>${state.friends.length}<small> 位</small></b><span>已收到评价</span></div>
      <div class="stat"><b>${analysis ? analysis.maxAbs + '<small> 分</small>' : '—'}</b><span>最大偏差</span></div>
    </div>`;

  const radarHtml = `
    <div class="card radar-wrap">
      <div class="legend">
        <span><i class="dot self"></i>你眼中的自己</span>
        ${friendScores ? '<span><i class="dot them"></i>朋友眼中的你</span>' : ''}
      </div>
      ${radarSVG(selfScores, friendScores)}
    </div>`;

  const misreadHtml = analysis ? `
    <div class="card callout">
      <p class="eyebrow">最大误读</p>
      <h3>${DIMS[analysis.max.i].name}</h3>
      <div class="compare">
        <div><b>${analysis.max.self}</b><span>你自评</span></div>
        <div class="arrow">→</div>
        <div><b>${analysis.max.friend}</b><span>朋友看你</span></div>
      </div>
      <p class="sub">${misreadSentence(analysis.max)}</p>
    </div>` : `
    <div class="card">
      <p class="eyebrow">还差一步</p>
      <h3 style="font-size:19px;line-height:1.45;margin:0 0 8px">好友眼中的你，还没到货</h3>
      <p class="sub">把下面的 6 位好友码发给朋友，让 TA 评价你；收到回传码后，这里会出现双雷达对比。</p>
    </div>`;

  const otherHtml = analysis && analysis.top.length > 1 ? `
    <div class="card">
      <p class="eyebrow">其他偏差</p>
      ${analysis.top.slice(1, 4).map(g => `
        <div class="gap-row">
          <span class="name">${DIMS[g.i].name}</span>
          <span class="nums">${g.self} → ${g.friend}</span>
          <em>${g.gap > 0 ? '更' + DIMS[g.i].highLabel : '更' + DIMS[g.i].lowLabel}</em>
        </div>`).join('')}
    </div>` : '';

  const labelsHtml = `
    <div class="card">
      <p class="eyebrow">人设标签</p>
      <div class="labels">
        <div><span>你眼中的自己</span><b>${selfLabel}</b></div>
        <div><span>朋友眼中的你</span><b>${friendLabel || '待解锁'}</b></div>
      </div>
      ${friendScores && friendLabel === selfLabel ? '<p class="sub" style="margin:12px 0 0">这次没跑偏，两边看到的是同一个人。</p>' : ''}
    </div>`;

  const wordsHtml = words.length ? `
    <div class="card">
      <p class="eyebrow">朋友用来形容你的词</p>
      <div class="words">
        ${words.map(([word, count]) => {
          const size = Math.min(26, 14 + count * 3);
          return `<span class="word" style="font-size:${size}px">${esc(word)}</span>`;
        }).join('')}
      </div>
    </div>` : '';

  const shareHtml = `
    <div class="poster">
      <p class="poster-kicker">我的好友码</p>
      <div class="poster-code">${state.self.code}</div>
      <p class="poster-tip">${IS_WEB ? '把下面的邀请链接发给朋友，TA 点开就能直接开始评价（好友码已自动带上）；TA 测完把回传码发给你，粘贴到下方即可。' : '把这份 HTML 文件发给朋友，让 TA 选「帮好友评价」并输入上面的码；TA 测完把回传码发给你，粘贴到下方即可。'}</p>
      <div class="stack">
        <button class="btn accent small" onclick="copyText(inviteUrl(),'邀请链接已复制')">复制邀请链接</button>
        <button class="btn ghost small" onclick="copyText('${state.self.code}','好友码已复制')">仅复制好友码</button>
        <button class="btn ghost small" onclick="copyInvite()">复制邀请文案</button>
      </div>
    </div>`;

  const importHtml = `
    <div class="card">
      <p class="eyebrow">导入好友评价</p>
      <h3 style="font-size:17px;line-height:1.45;margin:0 0 10px">粘贴好友的回传码</h3>
      <textarea class="input code-input" id="importInput" aria-label="好友回传码" placeholder="P1.XXXXXX.0123012301230123..."></textarea>
      <button class="btn primary" style="margin-top:12px" onclick="importFriend()">导入评价</button>
    </div>`;

  app.innerHTML = `
    <section class="screen">
      <div class="quiz-top">
        <button class="icon-btn" onclick="go('home')" aria-label="返回首页">←</button>
        <div class="meta">我的报告</div>
        <div class="spacer"></div>
      </div>
      <header>
        <p class="eyebrow">人设偏差报告</p>
        <h1 class="brand report">${title}</h1>
        <p class="lede">${sub}</p>
      </header>
      <div class="report-stack">
        ${statsHtml}
        ${radarHtml}
        ${misreadHtml}
        ${otherHtml}
        ${labelsHtml}
        ${wordsHtml}
        ${shareHtml}
        ${importHtml}
        <button class="btn ghost" onclick="restartSelf()">重新测一次</button>
      </div>
      <p class="disclaimer">娱乐向小测试，不构成心理评估。所有数据只保存在本机浏览器，清除缓存或换设备会丢失。</p>
    </section>`;
}

/* ---------- reset ---------- */

function openReport(){
  if(state.self) go('report');
  else go('home');
}

function restartSelf(){
  if(!confirm('重新测试会清空当前报告和已导入的好友评价，确定吗？')) return;
  if(state.self){
    try{ localStorage.removeItem(LS_FRIENDS + state.self.code); }catch(e){}
  }
  try{ localStorage.removeItem(LS_SELF); }catch(e){}
  state.self = null;
  state.friends = [];
  state.idx = 0;
  state.answers = Array(16).fill(null);
  state.locked = false;
  go('home');
}

/* ---------- init ---------- */

function init(){
  state.self = loadSelf();
  if(state.self){
    state.self.scores = scoreAnswers(state.self.answers);
    state.friends = loadFriends(state.self.code).map(f => ({
      ...f,
      scores: scoreAnswers(f.answers)
    }));
  }
  const invited = inviteCodeFromUrl();
  if(invited && !(state.self && state.self.code === invited)){
    state.inviteCode = invited;
    go('invite');
  }else{
    go('home');
  }
}

init();
</script>
